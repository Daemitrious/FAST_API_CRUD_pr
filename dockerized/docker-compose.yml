services:
  backend:
    build:
      context: ./backend
    container_name: fastapi-crud-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app.db:/app/app.db

  frontend:
    build:
      context: ./frontend
    container_name: fastapi-crud-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
